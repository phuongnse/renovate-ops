name: Renovate

on:
  repository_dispatch:
    types: [engineering-process-published]
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - production

concurrency:
  group: renovate-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  renovate:
    name: Renovate (${{ github.event_name == 'repository_dispatch' && 'release-event' || inputs.mode }})
    if: >-
      (github.event_name == 'repository_dispatch' &&
      vars.RENOVATE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'dry-run' || vars.RENOVATE_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RENOVATE_ATTEMPT_ONE_LOG: /tmp/renovate-production-attempt-1.ndjson
      RENOVATE_ATTEMPT_TWO_LOG: /tmp/renovate-production-attempt-2.ndjson
      RENOVATE_DRY_RUN_LOG: /tmp/renovate-dry-run.ndjson
      LOG_FILE_FORMAT: json
      LOG_FILE_LEVEL: info
    steps:
      - name: Check out operations config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate authenticated release event
        if: github.event_name == 'repository_dispatch'
        run: node scripts/validate-release-event.mjs "$GITHUB_EVENT_PATH"

      - name: Resolve repository allowlist
        id: allowlist
        run: node scripts/export-repositories.mjs >> "$GITHUB_OUTPUT"

      - name: Require fresh bounded outcome logs
        run: |
          test ! -e "$RENOVATE_DRY_RUN_LOG"
          test ! -e "$RENOVATE_ATTEMPT_ONE_LOG"
          test ! -e "$RENOVATE_ATTEMPT_TWO_LOG"

      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: phuongnse
          repositories: ${{ steps.allowlist.outputs.repositories }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Renovate dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          configurationFile: config.cjs
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.37.1@sha256:23183a49b33d9d41f93f4ed0e78bb6171ace9e847efea557bbadb312d5dc3646 # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|LOG_FORMAT|LOG_FILE(?:_LEVEL|_FORMAT)?|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$'
        env:
          LOG_FILE: ${{ env.RENOVATE_DRY_RUN_LOG }}
          LOG_FORMAT: json
          LOG_LEVEL: info
          RENOVATE_DRY_RUN: full
          RENOVATE_REPOSITORIES: ${{ steps.allowlist.outputs.renovate_repositories }}

      - name: Renovate production attempt 1
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          configurationFile: config.cjs
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.37.1@sha256:23183a49b33d9d41f93f4ed0e78bb6171ace9e847efea557bbadb312d5dc3646 # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|LOG_FORMAT|LOG_FILE(?:_LEVEL|_FORMAT)?|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$'
        env:
          LOG_FILE: ${{ env.RENOVATE_ATTEMPT_ONE_LOG }}
          LOG_FORMAT: json
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ steps.allowlist.outputs.renovate_repositories }}

      - name: Classify production attempt 1
        id: production_attempt_one
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        run: node scripts/classify-renovate-log.mjs "$RENOVATE_ATTEMPT_ONE_LOG" repositories.json

      - name: Wait before the single bounded recovery attempt
        if: steps.production_attempt_one.outputs.status == 'retryable'
        run: node scripts/wait-for-renovate-retry.mjs

      - name: Renovate production attempt 2
        if: steps.production_attempt_one.outputs.status == 'retryable'
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          configurationFile: config.cjs
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.37.1@sha256:23183a49b33d9d41f93f4ed0e78bb6171ace9e847efea557bbadb312d5dc3646 # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|LOG_FORMAT|LOG_FILE(?:_LEVEL|_FORMAT)?|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$'
        env:
          LOG_FILE: ${{ env.RENOVATE_ATTEMPT_TWO_LOG }}
          LOG_FILE_LEVEL: debug
          LOG_FORMAT: json
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ steps.allowlist.outputs.renovate_repositories }}

      - name: Validate production attempt 2
        id: production_attempt_two
        if: steps.production_attempt_one.outputs.status == 'retryable'
        run: node scripts/validate-renovate-log.mjs "$RENOVATE_ATTEMPT_TWO_LOG" repositories.json

      - name: Finalize verified process adoption pull requests
        if: >-
          github.event_name == 'repository_dispatch' &&
          (steps.production_attempt_one.outputs.status == 'passed' ||
          steps.production_attempt_two.outcome == 'success')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          node scripts/finalize-adoption-prs.mjs
          "$GITHUB_EVENT_PATH"
          repositories.json

      - name: Open or update an operations incident
        if: failure() && (github.event_name == 'repository_dispatch' || inputs.mode == 'production')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Renovate production run is failing"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="Production run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Resolve the operations incident after recovery
        if: success() && (github.event_name == 'repository_dispatch' || inputs.mode == 'production')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Renovate production run is failing"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Recovered in: $RUN_URL"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
