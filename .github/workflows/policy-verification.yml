name: Policy verification

on:
  workflow_call:
    inputs:
      target_pr_number:
        description: Pull request number supplied by an event-driven caller
        required: false
        type: string
      target_head_sha:
        description: Exact pull request head supplied by an event-driven caller
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  policy-verification:
    name: policy-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve the immutable policy event
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR_NUMBER: ${{ inputs.target_pr_number }}
          REQUESTED_HEAD_SHA: ${{ inputs.target_head_sha }}
        run: |
          event_path="$RUNNER_TEMP/policy-verification-event.json"
          if test -n "$REQUESTED_PR_NUMBER" || test -n "$REQUESTED_HEAD_SHA"; then
            test -n "$REQUESTED_PR_NUMBER"
            test -n "$REQUESTED_HEAD_SHA"
            printf '%s' "$REQUESTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
            gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR_NUMBER" \
              > "$RUNNER_TEMP/reviewed-pull-request.json"
            test "$(jq -r .head.sha "$RUNNER_TEMP/reviewed-pull-request.json")" = "$REQUESTED_HEAD_SHA"
            jq --arg repository "$GITHUB_REPOSITORY" \
              '{repository: {full_name: $repository}, pull_request: .}' \
              "$RUNNER_TEMP/reviewed-pull-request.json" > "$event_path"
          else
            cp "$GITHUB_EVENT_PATH" "$event_path"
          fi
          pr_number="$(jq -r '.pull_request.number // empty' "$event_path")"
          head_sha="$(jq -r '.pull_request.head.sha // empty' "$event_path")"
          test -n "$pr_number"
          printf '%s' "$head_sha" | grep -Eq '^[0-9a-f]{40}$'
          {
            printf 'event_path=%s\n' "$event_path"
            printf 'pr_number=%s\n' "$pr_number"
            printf 'head_sha=%s\n' "$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out policy target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.target.outputs.head_sha }}
          path: target

      - name: Check out immutable verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: trusted-verifier

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Verify immutable policy boundary
        env:
          TRUSTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: >-
          node trusted-verifier/scripts/policy-verification.mjs
          --project-root target
          --event-path "${{ steps.target.outputs.event_path }}"
          --output "$RUNNER_TEMP/policy-verification/report.json"

      - name: Publish verification evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-verification-${{ steps.target.outputs.pr_number }}-${{ steps.target.outputs.head_sha }}
          path: ${{ runner.temp }}/policy-verification/report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
