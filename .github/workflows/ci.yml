name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-verification:
    name: policy-verification
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: phuongnse/renovate-ops/.github/workflows/policy-verification.yml@817bf28e0e534bc1b07c0b5f703038475583c77c

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install published process runtime
        uses: phuongnse/engineering-process@cb2563e5a90a644af5be596d9418bb13f065aa12 # v0.4.0
        with:
          project-root: .
          requirements-lock: requirements/process.txt

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate complete process adoption candidate
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'automation/process/engineering-process')
        run: >-
          processctl adoption check
          --project-root .
          --requirements-lock requirements/process.txt

      - name: Validate process distribution and environment
        run: |
          processctl sync --project-root . --check
          processctl doctor --project-root . --profile development
          processctl doctor --project-root . --profile review

      - name: Run governed process profiles
        run: |
          processctl verify --project-root . --profile development
          processctl verify --project-root . --profile review

      - name: Check whitespace
        run: git diff --check
