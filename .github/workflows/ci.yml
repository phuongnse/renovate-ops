name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-verification:
    name: Policy verification
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: phuongnse/renovate-ops/.github/workflows/policy-verification.yml@38d952b8c94604df10fadc48b6c830a144ea1137

  validate:
    name: Validate operations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install published process runtime
        run: >-
          python -m pip install
          --isolated
          --disable-pip-version-check
          --no-input
          --require-hashes
          --only-binary :all:
          -r requirements/process.txt

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare exact Renovate validation runtime
        run: >-
          processctl setup
          --project-root .
          --profile review
          --apply
          --allow project-files

      - name: Validate complete process adoption candidate
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'automation/renovate/engineering-process')
        run: >-
          processctl adoption check
          --project-root .
          --requirements-lock requirements/process.txt

      - name: Validate process distribution and environment
        run: |
          processctl adoption check --project-root . --requirements-lock requirements/process.txt
          processctl doctor --project-root . --profile development
          processctl doctor --project-root . --profile review

      - name: Run governed process profiles
        run: |
          processctl verify --project-root . --profile development
          processctl verify --project-root . --profile review

      - name: Check whitespace
        run: git diff --check
